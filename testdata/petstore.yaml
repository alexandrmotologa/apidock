openapi: 3.1.0
info:
  title: Petstore Luxury API
  description: High-performance pet store and inventory management service demonstration.
  version: 1.2.0
  contact:
    name: APIDock Engineering
    url: https://github.com/alexandrmotologa/apidock
servers:
  - url: http://localhost:4010
    description: Mock Server
  - url: https://api.petstore.example.com/v1
    description: Production Cluster
  - url: https://staging.petstore.example.com/v1
    description: Staging Environment
tags:
  - name: pets
    description: Operations about pets in inventory
  - name: store
    description: Access to Petstore orders and inventory
  - name: user
    description: Operations about store operators and accounts
paths:
  /pets:
    get:
      tags:
        - pets
      summary: List all pets
      description: Returns a paginated list of pets available for adoption or purchase.
      operationId: listPets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: integer
            format: int32
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          description: Status values that need to be considered for filter
          required: false
          schema:
            type: string
            enum: [available, pending, sold]
            default: available
      responses:
        '200':
          description: A paged array of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          description: Bad request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - pets
      summary: Create a pet
      description: Creates a new pet entry in the store catalog.
      operationId: createPet
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        description: Pet to add to the store
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Pet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pets/{petId}:
    get:
      tags:
        - pets
      summary: Info for a specific pet
      description: Returns detailed information for a pet identified by its UUID or integer ID.
      operationId: showPetById
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
            format: uuid
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              examples:
                goldenRetriever:
                  summary: A friendly Golden Retriever
                  value:
                    id: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                    name: "Buddy"
                    tag: "dog"
                    status: "available"
                    category:
                      id: 1
                      name: "Canines"
                    photoUrls:
                      - "https://images.example.com/pets/buddy.jpg"
                    createdAt: "2026-11-01T12:00:00Z"
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: "Pet with given ID was not found in catalog"
    delete:
      tags:
        - pets
      summary: Deletes a pet
      description: Removes a pet from the active system.
      operationId: deletePet
      security:
        - ApiKeyAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          description: The pet ID to delete
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Pet deleted successfully
        '404':
          description: Pet not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /store/inventory:
    get:
      tags:
        - store
      summary: Returns pet inventories by status
      description: Returns a map of status codes to quantities
      operationId: getInventory
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
              example:
                available: 42
                pending: 12
                sold: 85

  /store/order:
    post:
      tags:
        - store
      summary: Place an order for a pet
      operationId: placeOrder
      requestBody:
        description: Order placed for purchasing the pet
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Successful order submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid Order

components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Canines"
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: "7e57c729-2d1b-4f93-8db2-5b9c0379fce1"
        name:
          type: string
          example: "Kona"
        tag:
          type: string
          example: "dog"
        status:
          type: string
          enum: [available, pending, sold]
          example: "available"
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items:
            type: string
            format: uri
        createdAt:
          type: string
          format: date-time
          example: "2026-11-03T10:15:30Z"

    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: "Luna"
        tag:
          type: string
          example: "cat"
        status:
          type: string
          enum: [available, pending, sold]
          default: available
        category:
          $ref: '#/components/schemas/Category'

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "4c11b22e-1d3a-4a81-9b1b-93ff51d1e43c"
        petId:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 1
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [placed, approved, delivered]
          example: "placed"
        complete:
          type: boolean
          default: false

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          example: 400
        message:
          type: string
          example: "Invalid entity identifier provided"

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
      description: API key passed in header
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Standard JWT Bearer token authentication
